# Titles and ⓘ of ABG and Nassauische Heimstätte (catalog.py). ABG and NH per Stadtteil: count of 2011 × change up to
# 2022 (README). The calculation is the worked example alone.
# Every dwelling the Zensus 2022 counts as municipal goes to ABG and Nassauische Heimstätte (model.py: quarter table,
# "public" = abg + nh + new).
counting_rule: "The map counts every dwelling that the Zensus lists as municipal towards ABG and Nassauische Heimstätte."
# 72 % of the summed half ranges come from the unfilled secrecy gap 2011 (README, Limits)
cause: "The difference arises mainly because the Zensus 2011 assigns part of the dwellings to no ownership type for data protection reasons."

OWN_PUBLIC:
  title: "ABG and Nassauische Heimstätte"
  source: "Zensus 2011 and 2022, 100 m grid; tables 4000W-1011, 3000G-2007, 4000W-2013 · ABG new buildings up to 2021: own research"
  as_of: "{@core.z22_as_of} · base {@core.z11_as_of}"
  rule: "{@core.quarters_rule} {@counting_rule} {@core.tip_dwellings_rule}"
  # {estimate}: the sentence of shared/core/indicator.py estimate_range, filled by catalog.py
  uncertainty: "{estimate} {@cause} {@core.tip_dwellings_uncertainty}"

sources:
  abg_new_buildings:
    title: "ABG new buildings: own research from public sources"
    as_of: "8 October 2026"
    license: "Sources in the research"

# Row labels of the worked example (public_calc_example)
calc_example:
  scaled_2011: "Dwellings of ABG and Nassauische Heimstätte in 2011 whose ownership type the Zensus 2022 names"
  factor: "Change in the buildings up to 2022 in the quarter"
  no_owner_2022: "Dwellings of ABG and Nassauische Heimstätte in 2011 at places where the Zensus 2022 names no ownership type"
  new: "Dwellings at new sites since 2011"
  value: "Dwellings in 2022"
