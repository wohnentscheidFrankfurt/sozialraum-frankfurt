# Titles and ⓘ of the social housing indicators (catalog.py). {year}, {report_no} and the numbers of the rule are filled
# by catalog.py from the constants there; the step checks them against the report.
report_source: "Amt für Wohnungswesen, Jahresbericht Kommunale Wohnraumversorgung {year}"
# as-of date as the map shows it
end_of: "End of {year}"

units:
  dwellings: "dwellings"

sources:
  report:
    title: "Jahresbericht Kommunale Wohnraumversorgung {year} (Amt für Wohnungswesen)"
    license: "Stadt Frankfurt am Main"
  stock_file:
    title: "Statistikportal Frankfurt, Wohnungsbestand und Räume (Statistische Gebäudedatei)"
    license: "dl-de/by-2-0, Stadt Frankfurt am Main"

SH_SHARE:
  title: "Social housing"
  source: "{@report_source}, Table 1.2 {report_no} · Statistikportal Frankfurt, Wohnungsbestand (Gebäudedatei)"
  as_of: "{@end_of}"
  rule: "{@core.quarters_rule} Social housing (Sozialwohnungen) means dwellings whose rent and occupants are bound for a time. From 2025, only dwellings that are actually subsidised count. The {higher_income} subsidised dwellings for higher incomes do not count. {outside_stock} dwellings of social housing outside Frankfurt do not count either. {contract_only} dwellings secured by contract only do not count."
  legend_note: "Share of all dwellings. {@end_of}"

# a tooltip line of the share, no rule
SH_COUNT:
  title: "Social housing, number"
  source: "{@report_source}, Table 1.2 {report_no}"
  as_of: "{@end_of}"
  calc: "Social housing in the quarter"

# Row labels of the worked example (social_housing_calc_example)
calc_example:
  count: "Social housing"
  dwellings: "Dwellings in the quarter, including dormitories"
