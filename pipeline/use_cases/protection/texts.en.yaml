# Title and ⓘ of the coverage with social preservation (Milieuschutz), and the ⓘ of the statute overlays (catalog.py).
# {fetch_date} stays for the build.
statutes_source: "planAS, Erhaltungssatzungen"
fetched: "Retrieved {fetch_date}"

# the planAS data of protection and land are fetched together; assembly puts in the fetch date
sources:
  plan_as:
    title: "Erhaltungssatzungen und Bebauungspläne (planAS)"
    as_of: "retrieved {fetch_date}"
    license: "dl-de/by-2-0, Stadt Frankfurt am Main"

PROT_SOCIAL:
  title: "Social preservation coverage"
  source: "planAS, Erhaltungssatzungen · {@core.z22} (residents)"
  as_of: "{@fetched} · {@core.z22_as_of}"
  calc: "Residents in social preservation areas (Milieuschutz) ÷ residents in the area. A 100 m grid square counts if its centre lies in a valid social preservation area."
  rule: "Here, social preservation means a statute under § 172 para. 1 no. 2 BauGB (federal building code). These statutes aim to protect the current mix of residents. In these areas, demolition, alterations and changes of use need a permit. Areas whose statute is still in preparation do not count."

# The four statute overlays: title in the list, tip before the name in the tooltip, and the result protocol of the ⓘ:
# Source, As of, Rule (docs/texts.md, ⓘ protocol). `since` ends the tip of a townscape statute.
overlays:
  social_preservation:
    title: "Social preservation (hatched)"
    key: "Social preservation"
    tip: "Social preservation:"
    source: "{@statutes_source}"
    as_of: "{@fetched}"
    rule: "The map shows valid social preservation statutes (Milieuschutz) under § 172 para. 1 no. 2 BauGB (federal building code). These statutes aim to protect the current mix of residents. In these areas, demolition, alterations and changes of use need a permit."
  social_preservation_pending:
    title: "Social preservation in preparation (dashed)"
    key: "Social preservation in preparation"
    tip: "Social preservation in preparation:"
    source: "{@statutes_source}"
    as_of: "{@fetched}"
    rule: "The map shows social preservation statutes (Milieuschutz) in preparation under § 172 para. 1 no. 2 BauGB (federal building code). These statutes aim to protect the current mix of residents. The decision to draw up the statute has been made. The statute is not yet in force."
  townscape:
    title: "Townscape statute (dotted)"
    key: "Townscape statute"
    tip: "Townscape statute:"
    since: "in force since"
    source: "{@statutes_source}"
    as_of: "{@fetched}"
    rule: "The map shows townscape statutes (Ortsbildsatzung) under § 172 para. 1 no. 1 BauGB (federal building code). These statutes protect the look of a place. If a statute is also a social preservation statute, the map shows it under social preservation."
  townscape_pending:
    title: "Townscape statute in preparation (blue dashed)"
    key: "Townscape statute in preparation"
    tip: "Townscape statute:"
    since: "in preparation since"
    source: "{@statutes_source}"
    as_of: "{@fetched}"
    rule: "The map shows townscape statutes (Ortsbildsatzung) in preparation under § 172 para. 1 no. 1 BauGB (federal building code). These statutes protect the look of a place. If a statute is also a social preservation statute, the map shows it under social preservation."
