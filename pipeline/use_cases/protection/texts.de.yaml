# Title and ⓘ of the coverage with Milieuschutz, and the ⓘ of the statute overlays (catalog.py). {fetch_date} stays for
# the build.
statutes_source: "planAS, Erhaltungssatzungen"
fetched: "Abruf {fetch_date}"

# the planAS data of protection and land are fetched together; assembly puts in the fetch date
sources:
  plan_as:
    title: "Erhaltungssatzungen und Bebauungspläne (planAS)"
    as_of: "abgerufen {fetch_date}"
    license: "dl-de/by-2-0, Stadt Frankfurt am Main"

PROT_SOCIAL:
  title: "Abdeckung mit Milieuschutz"
  source: "planAS, Erhaltungssatzungen · {@core.z22} (Einwohner*innen)"
  as_of: "{@fetched} · {@core.z22_as_of}"
  calc: "Einwohner*innen in Milieuschutzgebieten ÷ Einwohner*innen im Gebiet. Ein 100-m-Feld zählt, wenn sein Mittelpunkt in einem gültigen Milieuschutzgebiet liegt."
  rule: "Als Milieuschutz zählt hier eine Satzung nach § 172 Abs. 1 Nr. 2 BauGB. Gebiete im Verfahren zählen nicht."

# The four statute overlays: title in the list, tip before the name in the tooltip, and the result protocol of the ⓘ:
# Quelle, Stand, Regel (docs/texts.md, ⓘ protocol). `since` ends the tip of an Ortsbildsatzung.
overlays:
  social_preservation:
    title: "Milieuschutz (schraffiert)"
    key: "Milieuschutz"
    tip: "Milieuschutz:"
    source: "{@statutes_source}"
    as_of: "{@fetched}"
    rule: "Die Karte zeigt gültige Satzungen nach § 172 Abs. 1 Nr. 2 BauGB."
  social_preservation_pending:
    title: "Milieuschutz im Verfahren (gestrichelt)"
    key: "Milieuschutz im Verfahren"
    tip: "Milieuschutz im Verfahren:"
    source: "{@statutes_source}"
    as_of: "{@fetched}"
    rule: "Die Karte zeigt Satzungen nach § 172 Abs. 1 Nr. 2 BauGB im Verfahren. Die Aufstellung ist beschlossen. Die Satzung ist noch nicht in Kraft."
  townscape:
    title: "Ortsbildsatzung (gepunktet)"
    key: "Ortsbildsatzung"
    tip: "Ortsbildsatzung:"
    since: "in Kraft seit"
    source: "{@statutes_source}"
    as_of: "{@fetched}"
    rule: "Die Karte zeigt Satzungen nach § 172 Abs. 1 Nr. 1 BauGB. Ist eine Satzung zugleich Milieuschutz, steht sie beim Milieuschutz."
  townscape_pending:
    title: "Ortsbildsatzung im Verfahren (blau gestrichelt)"
    key: "Ortsbildsatzung im Verfahren"
    tip: "Ortsbildsatzung:"
    since: "im Verfahren seit"
    source: "{@statutes_source}"
    as_of: "{@fetched}"
    rule: "Die Karte zeigt Satzungen nach § 172 Abs. 1 Nr. 1 BauGB im Verfahren. Ist eine Satzung zugleich Milieuschutz, steht sie beim Milieuschutz."
