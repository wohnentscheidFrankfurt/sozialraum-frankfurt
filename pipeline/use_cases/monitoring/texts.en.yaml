# Titles and ⓘ of the monitoring indicators (catalog.py).
report:
  # the Monitoring as a work, the base of every source line
  title: "Monitoring 2024 zur sozialen Segregation (Stadt Frankfurt)"
  as_of: "End of 2022"

sources:
  monitoring:
    title: "Monitoring 2024 zur sozialen Segregation"
    as_of: "2022"
    license: "Stadt Frankfurt am Main"

rule: "The social monitoring merges some sub-districts. The map shows them as one area. If a table merges other sub-districts, the map shows one value for these sub-districts together. If the social monitoring has no value, the map shows “n/a”. For districts this applies when sub-districts with more than 5% of the residents have no value."

# benefits as defined by the Monitoring for 2022 (p. 79): Bürgergeld only started on 1.1.2023
SOC_MIN_INCOME:
  title: "Minimum income support"
  source: "{@report.title}, table 14"
  as_of: "{@report.as_of}"
  calc: "People with Arbeitslosengeld II (unemployment benefit II), Sozialgeld (social benefit), Hilfe zum Lebensunterhalt (assistance with living costs), Grundsicherung im Alter und bei Erwerbsminderung (basic income support in old age and in case of reduced earning capacity) outside institutions or Asylbewerberleistungen (benefits for asylum seekers) ÷ residents. For districts the map averages the sub-districts, weighted by residents."
  rule: "{@rule}"
  uncertainty: "Residents of refugee accommodation centres count too. In sub-districts with large accommodation centres, the value is therefore high."
  legend_note: "Share of the residents. {@report.as_of}"

SOC_UNEMPLOYED:
  title: "Unemployment density"
  source: "{@report.title}, table 12"
  as_of: "{@report.as_of}"
  calc: "Unemployed people ÷ residents aged 15 to under 65. For districts the map averages the sub-districts, weighted by these residents."
  rule: "{@rule}"
  legend_note: "Unemployed people per resident aged 15 to 64. {@report.as_of}"

SOC_INDEX:
  title: "Deprivation index"
  source: "{@report.title}, table 28"
  as_of: "{@report.as_of}"
  calc: "The social monitoring ranks the sub-districts from 1 to 114 by unemployment density, minimum income support and living space per person. The higher the number, the more disadvantaged the area is."
  rule: "{@rule}"
  legend_note: "Rank from 1 to 114. The higher the number, the more disadvantaged the area is."

# The district numbers of a source row that holds districts outside the map unit (model.py _shared_value):
# {head} the numbers but the last, {last} the last one.
shared_districts: "{head} and {last}"
