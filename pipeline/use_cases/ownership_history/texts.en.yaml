# Texts of the view "Trend" (catalog.py, README). checks.py (check_history_headings, check_condo_rented) reads them and
# checks every statement in them.

# Groups of the charts “houses” and “arrows” (README). Keys are the ids of the groups.
# "about" stands in every tooltip of the group, "example" only in the tooltips of 2022 and of the chart “arrows”:
# Vonovia was called Deutsche Annington in 2011. "lines" breaks a long title in the chart “arrows”; joined with a
# space they give the title. The two company classes keep the names of the Zensus. Each name in an "example" has an
# entry of EXAMPLES in catalog.py (or in ownership_shares), whose phrases the build finds in the source.
groups:
  person:
    title: "Private individuals"
    about: "These are individual people, couples or groups of heirs."
    example: ""
  condo:
    title: "Condominium owners (WEG)"
    about: "The buildings are split into condominiums that are {@phrases.condo_rented}. The dwellings belong to people or companies."
    example: ""
  public:
    title: "Public sector (city, federal government, state)"
    about: "This includes the city, the state (Land) and the federal government (Bund), with their companies. The Zensus counted Nassauische Heimstätte under the state in 2011 and under the city in 2022. This view therefore combines city, federal government and state."
    example: "For example, ABG, Nassauische Heimstätte and Bundesanstalt für Immobilienaufgaben."
  housing_company:
    title: "Private housing companies"
    lines:
      "1": "Private"
      "2": "housing companies"
    about: "Their business is renting out housing."
    example: "For example, Vonovia, GWH and the family-run company Sahle Wohnen."
  other_company:
    title: "Other private companies"
    lines:
      "1": "Other private"
      "2": "companies"
    about: "This includes banks, investment funds and similar companies. Their main business is not renting out housing."
    example: "For example, Industria Wohnen and Hamburg Trust."
  coop:
    title: "Housing cooperatives"
    about: ""
    example: "For example, Volks- Bau- und Sparverein, Beamten-Wohnungs-Verein and Bauverein für Höchst."
  nonprofit:
    title: "Non-profit organisations"
    about: ""
    example: "For example, churches such as the Evangelischer Regionalverband Frankfurt und Offenbach."

# The sum of both company classes: lead lines and the charts “sizes” and “decades”
company_title: "Private companies"
# Sectors as in the city profile of the Rosa-Luxemburg-Stiftung (sources/other/RLS_Stadtprofil_Frankfurt.pdf, p. 1)
sectors:
  private: "Private"
  community: "Community"

sources:
  zensus_database:
    title: "Zensus database, tables 4000W-0001, 4000W-0004, 4000W-1008, 4000W-1011, 4000W-2013, 3000G-2001 and 3000G-2007 (Zensus 2011 and 2022, boundaries as of 2022)"
    as_of: "{@core.z11_as_of} and {@core.z22_as_of}"
    license: "{@core.zensus_license}"
  other_examples:
    title: "Examples of further owner groups: Wohnungsmarktbericht 2019/2020 (B 430/2022), answer of the Federal Government (BT-Drs. 19/7092), Kooperation Frankfurt, efo-magazin, answer of the Magistrat F 677/2017, website of Sahle Wohnen"
    as_of: "2018–2026"
    license: "Publications of the city, of the Federal Government, of the cooperatives, of the Protestant church and of the company Sahle Wohnen"
# The one source line below the charts; the licence as dl-de/by-2-0 asks; the tables are named in the data flow
# (docs/architecture.md, Data flow)
history_source: "Zensus 2011 and 2022, buildings with living space · Statistische Ämter des Bundes und der Länder, dl-de/by-2-0"

# Phrases of the headings, lead lines and tooltips that checks.py guards. Each stands once, here; the texts of charts
# and groups take them by reference. A translation keeps each phrase inside its text.
phrases:
  houses_title: "Buildings of private companies are the largest on average"
  houses_lead_buildings: "8% of the buildings"
  houses_lead_dwellings: "19% of the dwellings"
  decades_title: "Private companies grow mainly through existing buildings"
  decades_lead: "Three in four"
  arrows_title: "Dwellings of private companies have doubled"
  arrows_lead: "only half as much"
  sizes_title: "Private companies own one in three dwellings in large buildings"
  sizes_lead: "one in six"
  sizes_tip: "Two thirds of the growth"
  condo_rented: "mostly rented out"

# Texts of the four charts in the order of the view (README). {large} and {total} are numbers, filled by model.py.
charts:
  houses:
    title: "{@phrases.houses_title}"
    lead: "In 2022 they own {@phrases.houses_lead_buildings} and {@phrases.houses_lead_dwellings}."
    caveat: "“Community” includes the public sector, housing cooperatives and non-profit organisations."
  decades:
    title: "{@phrases.decades_title}"
    lead: "{@phrases.decades_lead} of the additional buildings since 2011 were built before 2010."
    caveat: ""
  arrows:
    title: "{@phrases.arrows_title}"
    lead: "The number of their buildings rose {@phrases.arrows_lead}."
    key: "The thin arrow shows buildings, the thick one dwellings. Each arrow runs from the circle (2011) to the tip (2022)."
    caveat: "A change of group can also come from a new classification."
  sizes:
    title: "{@phrases.sizes_title}"
    lead: "In 2022 this holds for buildings with 13 or more dwellings. In 2011 it was {@phrases.sizes_lead}."
    tip_large: "{@phrases.sizes_tip} since 2011 is here (+{large} of +{total})."
    caveat: ""

# Row labels and the long form for tooltips ("in buildings with 13 or more dwellings"). Keys are the size classes of the
# Zensus (shared/zensus/model.py, SIZES).
sizes:
  "1":
    label: "1 dwelling"
    long: "1 dwelling"
  "2":
    label: "2 dwellings"
    long: "2 dwellings"
  "3_6":
    label: "3–6 dwellings"
    long: "3–6 dwellings"
  "7_12":
    label: "7–12 dwellings"
    long: "7–12 dwellings"
  "13_plus":
    label: "13 or more"
    long: "13 or more dwellings"

# Row labels of the chart “decades”: the decades of construction of table 3000G-2001, keys from DECADE_KEYS in
# shared/zensus/tables.py. The tooltip puts the first letter in lower case (“built before 1919”).
decade_labels:
  before_1919: "Before 1919"
  "1919_1949": "1919–1949"
  "1950_1959": "1950–1959"
  "1960_1969": "1960–1969"
  "1970_1979": "1970–1979"
  "1980_1989": "1980–1989"
  "1990_1999": "1990–1999"
  "2000_2009": "2000–2009"
  "2010_2015": "2010–2015"
  from_2016: "2016 and later"
