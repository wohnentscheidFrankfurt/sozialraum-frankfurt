# Texts of the view „Neubau“: the columns of the dwellings (`view`) and the block of the stock, the rents, the prices and
# the wages (`rents`). Placeholders in curly braces that the catalog fills: {last_year}, {prev_year}, {years},
# {average}, {provisional_from}, {rent_from}, {rent_to}, {break_year}, {old_census}, {new_census}, {six_years_from},
# {price_month}, {rent_month}, {wage_quarter}, {survey}, {population_effect}, {stock_effect}, {same_stock},
# {same_population}, {published_stock}, {published_population}. The others ({year}, {first}, {base}, {dwellings},
# {population}, ...) stay for the model.

# Statements that checks.py tests against the data. The texts below reference them; a change of a phrase changes the
# statement in title, lead or ⓘ and its check together.
phrases:
  # 18 % <= share of the last year < 20 %
  fifth: "fast jede fünfte"
  # every share before the last year <= 12.5 %
  eighth: "höchstens jede achte"
  # the mean of all dwellings of the last years, rounded to hundreds
  lead_average: "in den letzten {years} Jahren jährlich durchschnittlich {average}"
  provisional_span: "{provisional_from} bis {last_year}"
  # the heading of the block of rents starts with it
  since: "Seit {rent_from}"
  older_less: "weniger als Preise und Löhne"
  # the lowest and the highest size of a household of all years; {low} and {high} come from the data (the check) or
  # from HOUSEHOLD_RANGE (the rule of the ⓘ)
  household_range: "von {rent_from} bis {rent_to} zwischen {low} und {high}"
  household_sentence: "Sie lag {@phrases.household_range}."
  # from the survey of this year the Mietspiegel counts the contracts of six years before the survey, before of four
  # (§ 558 BGB since 2020); the sentence stands in the Unsicherheit of the rents
  mietspiegel_window: "Seit {six_years_from} zählt der Mietspiegel sechs statt vier Jahre."
  # HSL, F I 1 j/25, Vorbemerkungen: since the HBO of 14.10.2025 (§ 63a) most demolitions need no permit
  outflow_caveat: "Seit Oktober 2025 brauchen die meisten Abrisse keine Genehmigung mehr. Das Landesamt erfasst Abgänge deshalb womöglich nicht mehr vollständig."

# „link“ of `view` and `rents` names the question of the figure in the fragment of a direct link (docs/design.md,
# Direct links); once published it never changes
view:
  link: "gefoerderte-wohnungen"
  title: "{last_year} wurde {@phrases.fifth} neue Wohnung gefördert, bis {prev_year} {@phrases.eighth}"
  lead: "Insgesamt wurden {@phrases.lead_average} Wohnungen gebaut, auch durch Umbau."
  key:
    new: "Neubau"
    subsidised: "davon gefördert (Miete gebunden)"
    provisional: "vorläufig"
    conversions: "Umbau bestehender Gebäude"
  info:
    source: "Hessisches Statistisches Landesamt, Baufertigstellungen · Magistrat der Stadt Frankfurt, Antworten B 12/2024, F 3150/2025, F 79/2026, F 9/2026 und F 158/2026"
    as_of: "Fertiggestellte Wohnungen bis 2025 (Bericht Mai 2026) · Geförderte Wohnungen: Antworten bis August 2026"
    # the column and the share stand in the written sums (calc_column, calc_share); the prose keeps the terms
    calc: "Neubau sind Wohnungen in neu gebauten Gebäuden, Wohnheime eingeschlossen. Umbau sind Wohnungen aus Baumaßnahmen an bestehenden Gebäuden, also aus Umbau, Ausbau, Erweiterung oder Wiederherstellung. Gefördert sind Wohnungen aus den Frankfurter Programmen für den Neubau bezahlbarer Mietwohnungen, Förderweg 1 und Förderweg 2. Der Magistrat zählt die Programme mit, die es vorher gab. Weil diese Programme den Neubau fördern, teilt der Anteil durch den Neubau, nicht durch alle Wohnungen."
    rule: "Gefördert heißt, dass die Miete für eine Zeit gebunden ist. Das sagt nichts über das Eigentum. Auch private Unternehmen und Personen bauen geförderte Wohnungen. Für {@phrases.provisional_span} gilt die letzte Antwort des Magistrats."
    uncertainty: "Die Förderzahlen {@phrases.provisional_span} sind vorläufig. Bisher hat der Magistrat frühe Zahlen nur nach oben korrigiert. Die geförderten Wohnungen zählt die Stadt nach ihren Förderprogrammen, den Neubau zählt das Landesamt. Beide Zählungen passen nicht genau zusammen. Wohnheime für Studierende zählen zum Beispiel nur beim Neubau mit. Vereinzelt entstehen geförderte Wohnungen auch durch Umbau. Beim Umbau zählt das Landesamt, was unter dem Strich dazukommt. Wer zwei Wohnungen zusammenlegt, verringert die Zahl. Für 2019 und 2020 nennt der Magistrat niedrigere Gesamtzahlen als das Landesamt."
  source: "Hessisches Statistisches Landesamt, Baufertigstellungen · Magistrat der Stadt Frankfurt"
  provisional_note: "Die Förderzahl ist vorläufig."
  # the tooltip of a year
  tip: "{year}: {all} Wohnungen, davon {new} im Neubau und {conversions} durch Umbau. Gefördert waren {subsidised}, das sind {share} des Neubaus."
  # the written sums of the ⓘ for the last year (docs/texts.md, Written sums): label and row texts
  calc_column:
    label: "Säule am Beispiel {year}"
    new_res: "Neubau in Wohngebäuden"
    new_nonres: "Neubau in Nichtwohngebäuden"
    new: "Neubau"
    conversions: "Umbau"
    all: "fertiggestellte Wohnungen"
  calc_share:
    label: "Anteil am Beispiel {year}"
    fw1: "Förderweg 1"
    fw2: "Förderweg 2"
    subsidised: "geförderte Wohnungen"
    subsidised_provisional: "geförderte Wohnungen (vorläufig)"
    new: "Neubau"
    share: "Anteil gefördert"

rents:
  link: "wohnungen-und-mieten"
  title: "{@phrases.since} wuchs die Zahl der Wohnungen schneller als die Bevölkerung, die Mieten neuer Verträge noch schneller"
  lead: "Die Mieten älterer Verträge stiegen {@phrases.older_less}."
  info:
    source: "Hessisches Statistisches Landesamt: Fortschreibung des Wohnungsbestands (Berichte F I 1 j/25 und j/22, Regionaldatenbank Tabelle 31231-02-01-4) · Fortschreibung des Bevölkerungsstands (Regionaldatenbank Tabelle 12411-01-01-4, Bericht A I 2, 2. Halbjahr 2022) · Verbraucherpreisindex Hessen (Bericht M I 2 j/25, Tabelle 3) · Nominallohnindex Hessen (Pressetabelle 3. Quartal 2025) · Stadt Frankfurt: Mietspiegel 2018, 2022 und 2024 (Gutachten), Mietspiegel 2026 (Dokumentation), Mietspiegel-Broschüren 2022 bis 2026 · Melderegister, offene Daten „Bevölkerung in Haushalten“ nach Stadtbezirken"
    as_of: "Wohnungen und Einwohner*innen 31.12.{rent_to} · Mieten {survey} · Preise {rent_month} {rent_to} · Löhne {wage_quarter}. Quartal {rent_to}"
    # the index and „ohne Inflation“ stand in the written sum (calc_rent); the prose keeps the rest
    calc: "Wohnungen und Einwohner*innen zählen am 31.12., Mieten, Preise und Löhne zur Jahresmitte. Die Miete ist der Mittelwert der Nettokaltmiete je Quadratmeter in der Stichprobe des Mietspiegels. Die anderen Linien rechnen genauso. Ohne Inflation wird auch der Lohn durch die Preise geteilt."
    # the check „rents households“ guards the range of the household size
    rule: "Neue Verträge haben in den sechs Jahren vor der Erhebung begonnen, {rent_from} in den vier Jahren davor. Ältere Verträge haben früher begonnen, ihre Miete wurde in dieser Zeit erhöht. Geförderte Wohnungen mit gebundener Miete zählen im Mietspiegel nicht mit. Einwohner*innen sind Personen mit Hauptwohnsitz in Frankfurt. Preise sind der Verbraucherpreisindex Hessen im Monat der Erhebung, in den Jahren dazwischen im {price_month}. Löhne sind die Bruttomonatsverdienste in Hessen im 2. und 3. Quartal. Die Haushaltsgröße zählt Personen je Haushalt im Melderegister. {@phrases.household_sentence}"
    # the four growths come from SAME_BASE_GROWTH and PUBLISHED_GROWTH; the check „rents uncertainty“ guards them
    # (docs/data-rules.md, Uncertainty)
    uncertainty: "{@phrases.mietspiegel_window} Das senkt seine Mittelwerte etwas. Der Mietspiegel rechnet nicht heraus, wie viel des Anstiegs auf neue und modernisierte Wohnungen entfällt. Verträge ohne Erhöhung fehlen im Mietspiegel. Die älteren Mieten sanken ohne Inflation vor allem 2022 und 2023, als die Preise stark stiegen. Die Löhne gelten für ganz Hessen. Der Zensus {new_census} hat die Bevölkerung um {population_effect} und die Wohnungen um {stock_effect} nach unten korrigiert. Auf gleicher Grundlage gerechnet wuchsen die Wohnungen seit {rent_from} um {same_stock} und die Bevölkerung um {same_population}. Die Linien zeigen die veröffentlichten Zahlen, {published_stock} und {published_population}. {@phrases.outflow_caveat} Die Zahlen zeigen nicht, wie viele Menschen eine passende Wohnung suchen. Sie zeigen auch nicht, wie hoch die Mieten ohne die neuen Wohnungen wären."
  source: "Index: Ende {rent_from} bzw. Mitte {rent_from} = 100. Quellen: Hessisches Statistisches Landesamt (Fortschreibung, Verbraucherpreisindex Hessen, Nominallohnindex Hessen), Frankfurter Mietspiegel 2018 bis 2026, Melderegister der Stadt Frankfurt"
  break_note: "ab {break_year} Zensus {new_census}"
  # the tooltips of the hollow dots
  old_base: "auf Grundlage des Zensus {old_census}"
  # the note below chart 1 in the wide drawing (the key holds the same entry on phones)
  old_base_note: "Die hohlen Punkte zeigen {break_year} auf der alten Grundlage (Zensus {old_census})."
  charts:
    nominal:
      title: "Mieten in Euro, wie im Vertrag"
      explain: "Das graue Band reicht zum Vergleich von den Preisen bis zu den Löhnen. Punkte zeigen die Stichtage des Mietspiegels."
      key:
        dwellings: "Wohnungen"
        population: "Einwohner*innen"
        new: "Miete neuer Verträge"
        old: "Miete älterer Verträge"
        prices: "Preise"
        wages: "Löhne in Hessen"
        old_base: "{break_year} auf alter Grundlage (Zensus {old_census})"
    real:
      title: "Mieten ohne Inflation"
      explain: "Hier ist die Inflation herausgerechnet. Eine Linie unter 100 heißt, dass die Miete weniger stieg als die Preise."
      key:
        new: "Miete neuer Verträge"
        old: "Miete älterer Verträge"
        prices: "Preise (= 100)"
        wages: "Löhne in Hessen, ohne Inflation"
  # the end labels at the last year (wide drawing only): value, then the name
  names:
    new: "neue Verträge"
    old: "ältere Verträge"
    prices: "Preise"
    wages: "Löhne in Hessen"
    dwellings: "Wohnungen"
    population: "Einwohner*innen"
  # the tooltip of a year slot: head and rows (value, then the label), a note, in 2022 the old base
  tip_head: "{year}, Index {base} = 100"
  tip_dwellings: "Wohnungen"
  tip_population: "Einwohner*innen"
  tip_new: "neue Verträge"
  tip_old: "ältere Verträge"
  tip_prices: "Preise"
  tip_wages: "Löhne in Hessen"
  tip_wages_real: "Löhne in Hessen, ohne Inflation"
  tip_survey: "Miete zum Stichtag des Mietspiegels."
  tip_no_survey: "Keine Mietspiegel-Erhebung in diesem Jahr."
  tip_old_base: "Auf alter Grundlage: Wohnungen {dwellings}, Einwohner*innen {population}."
  # a row of the tooltip: {label} with the count or the rent and the survey day in brackets
  tip_count: "{label} ({count})"
  tip_rent_new: "{label} ({rent}, {date})"
  tip_rent_old: "{label} ({rent})"
  # the tooltip of a hollow dot: {label} is tip_dwellings or tip_population
  tip_hollow: "31.12.{year} {old_base}: {value} {label} ({count})."
  # the row, the whole text and the note with the old base in front
  tip_row: "{value} {label}"
  tip_text: "{head}: {rows}. {note}"
  tip_note_old_base: "{old_base} {note}"
  # the written sum of the ⓘ: the new contracts of the last year as index and without inflation
  calc_rent:
    label: "Rechnung am Beispiel neuer Verträge {year}"
    rent: "Nettokaltmiete je m², neue Verträge {year}"
    base: "dasselbe {first}"
    nominal: "in Euro, wie im Vertrag ({first} = 100)"
    prices: "Preise {year} ({first} = 100)"
    real: "ohne Inflation"

