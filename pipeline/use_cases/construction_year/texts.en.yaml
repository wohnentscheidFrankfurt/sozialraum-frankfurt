# Titles and ⓘ of the dwellings by year of construction (catalog.py). Dwellings by year of construction (README): the
# class in 2011, capped per cell at the dwellings of 2022 (count), and its share of the dwellings in 2022 (both are
# estimates). {year_2022} and {year_2011} are the years of the two Zensus; {rounding} is the sentence of
# shared/core/indicator.py tooltip_rounding; {years} is the class under `years`; catalog.py fills them.
source: "Zensus 2011, 100 m grid, dwellings by year of construction"
share_source: "{@source} · {@core.z22}, dwellings"
share_as_of: "{@core.z11_as_of} · {@core.z22_as_of}"
legend_note: "Share of all dwellings in {year_2022}, estimated from the year of construction according to the Zensus {year_2011}"
base_rule: "Grid squares without dwellings in 2022 do not count. After complete destruction, the year of rebuilding counts."
uncertainty: "New dwellings created in old buildings since 2011 are not included. {@core.field_edge}"
# the dwellings, as the rounding sentence names them
dwellings_phrase: "dwellings"
# The Rechnung of the share is the worked example alone (README, „Worked example“).
count_title: "{title}, dwellings"
count_calc: "Dwellings in buildings with year of construction {years} according to the Zensus 2011, per grid square, at most as many as there were in 2022. {@core.field_sum}"

units:
  dwellings: "dwellings"

# The class of each indicator as the texts name it
years:
  HOU_PRE1919: "before 1919"
  HOU_1949_1978: "1949 to 1978"

HOU_PRE1919:
  title: "Old buildings from before 1919"
  # only this class has an extra rule: it names the oldest buildings
  rule: "{@base_rule} Buildings from before 1870 count too. {rounding}"

HOU_1949_1978:
  title: "Post-war buildings 1949–1978"
  rule: "{@base_rule} {rounding}"

# Row labels of the worked example (construction_calc_example)
calc_example:
  first: "Dwellings in buildings with year of construction {years}, Zensus 2011"
  capped: "more dwellings than there were in the same 100 m grid square in 2022"
  class_total: "Dwellings in buildings with year of construction {years}"
  all_2022: "all dwellings in 2022"
