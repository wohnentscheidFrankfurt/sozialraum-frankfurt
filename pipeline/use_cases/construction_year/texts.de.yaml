# Titles and ⓘ of the dwellings by year of construction (catalog.py). Dwellings by year of construction (README): the
# class in 2011, capped per cell at the dwellings of 2022 (count), and its share of the dwellings in 2022 (both are
# estimates). {year_2022} and {year_2011} are the years of the two Zensus; {rounding} is the sentence of
# shared/core/indicator.py tooltip_rounding; {years} is the class under `years`; catalog.py fills them.
source: "Zensus 2011, 100-m-Gitter, Wohnungen nach Baujahr"
share_source: "{@source} · {@core.z22}, Wohnungen"
share_as_of: "{@core.z11_as_of} · {@core.z22_as_of}"
legend_note: "Anteil an allen Wohnungen {year_2022}, geschätzt aus dem Baujahr laut Zensus {year_2011}"
base_rule: "Felder ohne Wohnungen 2022 zählen nicht. Nach völliger Zerstörung zählt das Jahr des Wiederaufbaus."
uncertainty: "Neue Wohnungen in alten Gebäuden seit 2011 fehlen. {@core.field_edge}"
# the dwellings, as the rounding sentence names them
dwellings_phrase: "Wohnungen"
# The Rechnung of the share is the worked example alone (README, „Worked example“).
count_title: "{title}, Wohnungen"
count_calc: "Wohnungen in Gebäuden mit Baujahr {years} laut Zensus 2011, je Feld höchstens so viele wie 2022 dort stehen. {@core.field_sum}"

units:
  dwellings: "Wohnungen"

# The class of each indicator as the texts name it
years:
  HOU_PRE1919: "vor 1919"
  HOU_1949_1978: "1949 bis 1978"

HOU_PRE1919:
  title: "Altbau vor 1919"
  # only this class has an extra rule: it names the oldest buildings
  rule: "{@base_rule} Bauten vor 1870 zählen mit. {rounding}"

HOU_1949_1978:
  title: "Nachkriegsbau 1949–1978"
  rule: "{@base_rule} {rounding}"

# Row labels of the worked example (construction_calc_example)
calc_example:
  first: "Wohnungen in Gebäuden mit Baujahr {years}, Zensus 2011"
  capped: "mehr Wohnungen, als 2022 im selben 100-m-Feld stehen"
  class_total: "Wohnungen in Gebäuden mit Baujahr {years}"
  all_2022: "alle Wohnungen 2022"
